[project]
name = "marimo-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "auto-mix-prep>=0.2.0",
    "gamspy>=0.15.0",
    "marimo>=0.18.4",
    "matplotlib>=3.10.8",
    "ortools>=9.14.6206",
    "pillow>=12.0.0",
    "plotly>=5.24.0",
    "poethepoet>=0.38.0",
]
[tool.poe.tasks]
edit = "marimo edit notebooks"
# Currently only runs the coursework notebook. See https://github.com/jnewbery/energy-data/edit/m/server.py for a way to server multiple notebooks.
run = "marimo run notebooks/coursework/coursework_notebook.py"
test = "python notebooks/coursework/test_solver.py"
